services:
  mysql:
    image: mysql:8.4
    container_name: skipper-cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/main/resources/db/migration/V1__init_cms.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: skipper-cms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
    container_name: skipper-cms-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CMS_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      CMS_DB_USERNAME: ${MYSQL_USER}
      CMS_DB_PASSWORD: ${MYSQL_PASSWORD}
      CMS_REDIS_HOST: redis
      CMS_REDIS_PORT: 6379
      CMS_JWT_SECRET: ${CMS_JWT_SECRET}
      CMS_CORS_ALLOWED_ORIGINS: ${CMS_CORS_ALLOWED_ORIGINS}
      CMS_UPLOAD_ROOT: /app/uploads
      CMS_UPLOAD_PREFIX: /uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads

  site:
    build:
      context: ./frontend/site
    container_name: skipper-cms-site
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${SITE_PUBLIC_PORT:-8888}:80"

  admin:
    build:
      context: ./frontend/admin
    container_name: skipper-cms-admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${ADMIN_PUBLIC_PORT:-8889}:80"

volumes:
  mysql_data:
  redis_data:
  uploads_data:
